    <g class="e" style="animation-delay:0.45s"><path d="M628.8,240H763.0999999999999V269L754.0999999999999,278H619.8V249L628.8,240Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="637.8" y="265.5">SECURITY</text></g>
    <g class="e" style="animation-delay:0.48s"><path d="M782.0999999999999,240H984.8999999999999V269L975.8999999999999,278H773.0999999999999V249L782.0999999999999,240Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="791.0999999999999" y="265.5">MANUFACTURING</text></g>
    <g class="e" style="animation-delay:0.52s"><path d="M73,288H248.39999999999998V317L239.39999999999998,326H64V297L73,288Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="82" y="313.5">WAREHOUSING</text></g>
    <g class="e" style="animation-delay:0.55s"><path d="M267.4,288H415.4V317L406.4,326H258.4V297L267.4,288Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="276.4" y="313.5">LOGISTICS</text></g>
    <g class="e" style="animation-delay:0.59s"><path d="M434.4,288H541.3V317L532.3,326H425.4V297L434.4,288Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="443.4" y="313.5">RETAIL</text></g>
    <g class="e" style="animation-delay:0.62s"><path d="M560.3,288H680.9V317L671.9,326H551.3V297L560.3,288Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="569.3" y="313.5">FINANCE</text></g>
    <g class="e" style="animation-delay:0.66s"><path d="M699.9,288H847.9V317L838.9,326H690.9V297L699.9,288Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="708.9" y="313.5">EDUCATION</text></g>
    <g class="e" style="animation-delay:0.69s"><path d="M866.9,288H1028.6V317L1019.5999999999999,326H857.9V297L866.9,288Z" fill="#080C14" stroke="#16202E" stroke-width="1"/><text class="tag" x="875.9" y="313.5">HEALTHCARE</text></g>

    <rect class="scan" x="0" y="-6" width="1200" height="382" fill="url(#scan)" opacity=".2"/>
    <rect class="sweep" x="0" y="-370" width="1200" height="370" fill="url(#sweepG)"/>
    <rect x="0" y="0" width="1200" height="370" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
    <rect x="0" y="0" width="1200" height="370" fill="url(#vig)"/>
  </g>
  <path d="M20.5,0.5H1199.5V349.5L1179.5,369.5H0.5V20.5L20.5,0.5Z" fill="none" stroke="#223044" stroke-width="1"/><path d="M1179,1.5 H1198.5 V21" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity=".85"/><path d="M1.5,349 V368.5 H21" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity=".85"/><path d="M0.5,20 L20,0.5" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity=".55"/><path d="M1180,369.5 L1199.5,350" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity=".55"/>
