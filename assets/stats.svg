<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img"
     aria-label="GitHub statistics for egoistonly: repositories 102, years on github 11, industries served 11. Domains: development, infrastructure, design, security, manufacturing, warehousing, logistics, retail, finance, education, healthcare">
  <title>GitHub statistics</title>
  <defs>
    <style><![CDATA[
@font-face {
  font-family: 'Archivo';
  font-style: normal;
  font-weight: 800;
  font-stretch: 125%;
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400;
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
}
text { font-family:'JetBrains Mono',ui-monospace,monospace; }
.num { font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-stretch:125%;
  font-size:74px; letter-spacing:-.02em; fill:#E8F0FA; }
.lbl { font-size:19px; letter-spacing:.2em; fill:#66788F; }
.cap { font-size:19px; letter-spacing:.2em; fill:#66788F; }
.leg { font-size:19px; fill:#AFBFD3; }
.tag { font-size:19px; letter-spacing:0.121em; fill:#AFBFD3; }

.e { animation: enter .85s cubic-bezier(.16,1,.3,1) backwards; }
@keyframes enter { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

.seg { animation: grow .95s cubic-bezier(.16,1,.3,1) backwards; }
@keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }

.scan { animation: drift 9s linear infinite; }
@keyframes drift { to { transform: translateY(4px); } }
.sweep { animation: sweep 8.5s cubic-bezier(.55,0,.45,1) infinite; }

@keyframes sweep { 0% { transform:translateY(0); } 62%,100% { transform:translateY(780px); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .e, .cell { opacity: 1 !important; transform: none !important; }
  .hz { opacity: .45 !important; }
  .gc, .gm, .gs1, .gs2 { opacity: 0 !important; }
}

@media (prefers-reduced-motion: reduce) { .seg { transform:none !important; } }
]]></style>
    <clipPath id="frame"><path d="M20,0H1200V350L1180,370H0V20L20,0Z"/></clipPath>
    <radialGradient id="glowM" cx=".2" cy=".1" r=".8">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

  <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
    <rect width="1" height="1" fill="#000" opacity=".45"/>
  </pattern>
  <linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00E5FF" stop-opacity=".055"/>
    <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vig" cx=".5" cy=".45" r=".78">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>
