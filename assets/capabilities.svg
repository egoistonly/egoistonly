    <style><![CDATA[
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400;
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 700;
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
}
text { font-family:'JetBrains Mono',ui-monospace,monospace; }
.ct { font-size:24.5px; font-weight:700; letter-spacing:0.16em; fill:#E8F0FA; }
.it { font-size:20.7px; fill:#AFBFD3; letter-spacing:.005em; }

.e { animation: enter .85s cubic-bezier(.16,1,.3,1) backwards; }
@keyframes enter { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

.rule { animation: rule .9s cubic-bezier(.16,1,.3,1) .25s backwards; }
@keyframes rule { from { transform:scaleX(0); } to { transform:scaleX(1); } }

.scan { animation: drift 9s linear infinite; }
@keyframes drift { to { transform: translateY(4px); } }
.sweep { animation: sweep 8.5s cubic-bezier(.55,0,.45,1) infinite; }

@keyframes sweep { 0% { transform:translateY(0); } 62%,100% { transform:translateY(844px); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .e, .cell { opacity: 1 !important; transform: none !important; }
  .hz { opacity: .45 !important; }
  .gc, .gm, .gs1, .gs2 { opacity: 0 !important; }
}

]]></style>
