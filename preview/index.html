<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile assets preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1117; font: 13px ui-monospace, monospace; color: #7d8590; }
  .col { max-width: 860px; margin: 0 auto; padding: 40px 20px 120px; }
  h2 { color: #e6edf3; font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
       border-bottom: 1px solid #21262d; padding-bottom: 8px; margin: 44px 0 16px; font-weight: 600; }
  img { display: block; max-width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row img { width: 190px; }
  .light { background: #ffffff; }
  .light h2 { color: #1f2328; border-color: #d1d9e0; }
</style>
</head>
<body>
  <div class="col">
    <h2>hero</h2>
    <img src="../assets/hero.svg" alt="hero">
    <h2>stack</h2>
    <img src="../assets/stack.svg" alt="stack">
    <h2>capabilities</h2>
    <img src="../assets/capabilities.svg" alt="capabilities">
    <h2>stats</h2>
    <img src="../assets/stats.svg" alt="stats">
    <h2>links</h2>
    <div class="row">
      <img src="../assets/btn-telegram.svg" alt="">
      <img src="../assets/btn-linkedin.svg" alt="">
      <img src="../assets/btn-x.svg" alt="">
      <img src="../assets/btn-maildotru.svg" alt="">
    </div>
  </div>
  <div class="light">
    <div class="col">
      <h2>hero on light background</h2>
      <img src="../assets/hero.svg" alt="hero light">
    </div>
  </div>
</body>
</html>
