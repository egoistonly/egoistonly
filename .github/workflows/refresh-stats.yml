name: refresh stats

# The public github-readme-stats instance is frequently paused, so the stats
# card is rendered here and committed as a static SVG.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - run: python tools/build.py stats
        env:
          # GH_PROFILE_TOKEN (PAT for egoistonly) keeps owned repo count accurate in CI.
          # Falls back to profile.json stats.repo_count, then public_repos.
          GH_TOKEN: ${{ secrets.GH_PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats card"
          git push
